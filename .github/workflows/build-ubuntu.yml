name: build ubuntu

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 
  
env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install deps
      run: sudo apt update && sudo apt-get -y install libudev-dev
    - name: Build binary
      run: cargo build --verbose
